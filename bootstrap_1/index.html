<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Bootstrap Assignment</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body>

  <!-- NAVBAR COMPONENT -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">My Website</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN SECTION -->
  <div class="container mt-5">

    <div class="row">
      
      <!-- CARD 1 -->
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          <img
            src="https://via.placeholder.com/300x200"
            class="card-img-top"
            alt="Image"
          >

          <div class="card-body">
            <h5 class="card-title">Card One</h5>
            <p class="card-text">
              This is an example Bootstrap card component.
            </p>

            <a href="#" class="btn btn-primary">Learn More</a>
          </div>
        </div>
      </div>

      <!-- CARD 2 -->
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          <img
            src="https://via.placeholder.com/300x200"
            class="card-img-top"
            alt="Image"
          >

          <div class="card-body">
            <h5 class="card-title">Card Two</h5>
            <p class="card-text">
              Bootstrap grid system makes layouts responsive.
            </p>

            <a href="#" class="btn btn-success">Explore</a>
          </div>
        </div>
      </div>

      <!-- CARD 3 -->
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          <img
            src="https://via.placeholder.com/300x200"
            class="card-img-top"
            alt="Image"
          >

          <div class="card-body">
            <h5 class="card-title">Card Three</h5>
            <p class="card-text">
              This website works on desktop and mobile phones.
            </p>

            <a href="#" class="btn btn-danger">Read More</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
